name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run legal -- --check
      - run: npm run format:check
      - run: npm test
      - run: npm run compile
      - run: npm run package
      - name: Upload VSIX
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: minecraft-workbench-vsix
          path: '*.vsix'
          if-no-files-found: error

  compatibility:
    strategy:
      fail-fast: false
      matrix:
        vscode: ['1.96.0', '1.101.0']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.0.0
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run compile
      - run: xvfb-run --auto-servernum npm run test:compat
        env:
          VSCODE_VERSION: ${{ matrix.vscode }}
      - run: npm run package
